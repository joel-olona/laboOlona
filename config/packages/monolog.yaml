monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - mvola 

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            mvola:
                type: rotating_file
                path: '%kernel.logs_dir%/mvola'
                level: info
                filename_format: 'mvola-{date}.log'
                date_format: 'Y-m-d'
                channels: [mvola]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            mvola:
                type: rotating_file
                path: '%kernel.logs_dir%/mvola'
                level: info
                filename_format: 'mvola-{date}.log'
                date_format: 'Y-m-d'
                channels: [mvola]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: rotating_file
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug
                formatter: monolog.formatter.json
            mvola:
                type: rotating_file
                path: '%kernel.logs_dir%/mvola'
                level: info
                max_files: 30
                filename_format: 'mvola-{date}.log'
                date_format: 'Y-m-d'
                channels: [mvola]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
